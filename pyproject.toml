[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-oracle"
version = "0.1.0"
description = "High-throughput Neuro-Symbolic Agent for automated phenotypic screening."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Harsh Shroff"},
]
keywords = [
    "agentic-ai", "neuro-symbolic", "drug-discovery", 
    "high-content-screening", "bioinformatics", "pydantic-ai", 
    "cellpose", "computer-vision", "python-3-11", "reproducible-research"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "cellpose>=3.0.0",
    "aicsimageio>=4.10.0",
    "scikit-image>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-ai",
    "tifffile>=2023.0.0",
    "requests>=2.31.0",
    "opencv-python-headless>=4.8.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "google-generativeai",
    "google-genai",
    "python-dotenv",
    "click",
    "pyarrow",
    "nest_asyncio",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "mlflow",
    "arize-phoenix",
]

[project.scripts]
bio-oracle = "src.main:main"

[project.urls]
"Homepage" = "https://github.com/HarshShroff/Bio-Oracle"
"Bug Tracker" = "https://github.com/HarshShroff/Bio-Oracle/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
